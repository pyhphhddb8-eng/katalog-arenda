<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:600px;height:600px;overflow:hidden;background:#14100C;color:#fff;position:relative;
 font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.glow{position:absolute;width:560px;height:560px;right:-230px;top:-230px;border-radius:50%;
 background:radial-gradient(circle,rgba(196,96,18,.30) 0%,rgba(20,16,12,0) 62%)}
.pad{position:absolute;left:0;right:0;top:0;padding:38px 40px 0;z-index:2}
.kick{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#A0897A;font-weight:700}
h1{margin-top:13px;font-size:35px;line-height:1.04;letter-spacing:-.02em;font-weight:800;max-width:510px}
.panel{margin-top:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
 border-radius:16px;padding:17px 20px 16px}
.duo{display:flex;gap:34px}
.duo>div{flex:1}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;color:#FFB13D;line-height:1;white-space:nowrap}
.unit{font-size:13.5px;color:#B0998A;font-weight:600;line-height:1.35;margin-top:7px}
.unit b{display:block;color:#fff;font-size:14.5px}
.shot{position:absolute;left:40px;right:40px;bottom:92px;height:118px;border-radius:11px;overflow:hidden;
 border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 40px rgba(0,0,0,.6);background:#fff}
.shot img{display:block;width:100%}
.foot{position:absolute;left:0;right:0;bottom:0;height:68px;background:#2B1708;
 display:flex;align-items:center;padding:0 40px;gap:14px}
.foot .t{font-size:16.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.foot .d{font-size:12.5px;color:#D0A273;margin-left:auto;font-weight:600;text-align:right;white-space:nowrap}
</style>
<div class="glow"></div>
<div class="pad">
  <div class="kick">Модуль для сайта · аренда инструмента</div>
  <h1>Каталог с подбором<br>по параметрам</h1>
  <div class="panel">
    <div class="duo">
      <div>
        <div class="big">4 регулятора</div>
        <div class="unit"><b>влияют на список вместе</b>тип, питание, вес, цена</div>
      </div>
      <div>
        <div class="big">100 тестов</div>
        <div class="unit"><b>отбор и расчёт цены</b>проверено без браузера</div>
      </div>
    </div>
  </div>
</div>
<div class="shot"><img src="file:///tmp/ka-shots/desktop.png" style="width:820px;margin-left:-10px;margin-top:-222px"></div>
<div class="foot"><span class="t">Счётчик у каждой отметки</span><span class="d">98 из 100 у Lighthouse</span></div>
